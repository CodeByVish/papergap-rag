# Proposal only: no application currently consumes this file.
seed: 42
data:
  dataset: allenai/qasper
  papers_path: data/processed/papers.jsonl
  qa_path: data/processed/qa.jsonl
  qasper_export_manifest: data/processed/qasper_export.manifest.json
  passages_path: data/processed/passages.jsonl
  chunk_words: 200
  overlap_words: 40
  normalization_version: text-normalization-v1
  chunking_version: word-chunking-v1
  source_kinds:
    - full_text
  split_policy:
    version: qasper-official-paper-disjoint-v0-proposed
    unit: paper
    official_to_project_role:
      train: development
      validation: validation
      test: held_out
    held_out_usage:
      index_paper_text: true
      forbidden_purposes:
        - tuning
        - prompt_design
        - chunk_selection
      require_frozen_for_final_evaluation: true
retrieval:
  paper_scoped: true
  dense_model: null  # P1 to select exact BGE checkpoint
  reranker_model: BAAI/bge-reranker-base
  sparse_candidates: 20
  dense_candidates: 20
  top_k: 5
  rrf_k: 60  # starting value; tune on development only
agent:
  max_retries: 2  # initial retrieval + two retries = at most three rounds
generation:
  model: Qwen/Qwen3-8B
  backend: null  # pending compute feasibility
  model_revision: null
  abstain_on_insufficient_evidence: true
evaluation:
  judge_model: null
  held_out_manifest: null  # Final held-out question pool is not frozen or created.
