# Shared configuration record, updated 7 November 2026. The frozen held-out settings are in
# configs/p4_freeze.json, which governs wherever the two differ. No application loads this file:
# tests/data/test_split_policy.py checks its split policy and held_out_manifest, and
# src/agent/nodes.py keeps MAX_RETRIES in sync with agent.max_retries by hand.
seed: 42
data:
  dataset: allenai/qasper
  papers_path: data/processed/papers.jsonl
  qa_path: data/processed/qa.jsonl
  qasper_export_manifest: data/processed/qasper_export.manifest.json
  passages_path: data/processed/passages.jsonl
  chunk_words: 365  # final corpus (P3): 365-word chunks, 40-word overlap; 28,617 passages from 1,584 papers
  overlap_words: 40
  normalization_version: text-normalization-v1
  chunking_version: word-chunking-v1
  source_kinds:
    - full_text
  split_policy:
    version: qasper-official-paper-disjoint-v0-proposed
    unit: paper
    official_to_project_role:
      train: development
      validation: validation
      test: held_out
    held_out_usage:
      index_paper_text: true
      forbidden_purposes:
        - tuning
        - prompt_design
        - chunk_selection
      require_frozen_for_final_evaluation: true
retrieval:
  paper_scoped: true
  dense_model: BAAI/bge-small-en-v1.5
  reranker_model: BAAI/bge-reranker-base
  reranker_enabled: false  # off in the final configuration: it lowered all four top-five metrics
  sparse_candidates: 20
  dense_candidates: 20
  top_k: 8  # frozen evaluation depth (configs/p4_freeze.json)
  rrf_k: 60  # as run on the held-out questions (configs/p4_freeze.json)
agent:
  max_retries: 2  # initial retrieval + two retries = at most three rounds
generation:
  model: Qwen/Qwen3-8B
  backend: vllm  # vLLM 0.11.0, bfloat16, one NVIDIA A40 (results/final/p5/README.md)
  model_revision: null  # the Hugging Face revision pin for Qwen3-8B remains open (report, Q4.1)
  max_passages: 8
  max_chars_per_passage: 2500  # code default since PR 72 and the final demo; the primary held-out run used 1200
  abstain_on_insufficient_evidence: true
evaluation:
  judge_model: qwen-plus-2025-12-01  # RAGAS judge through DashScope; embedding model qwen3.7-text-embedding
  held_out_freeze_record: configs/p4_freeze.json  # pins the 200 held-out questions (SHA-256) and the run settings
  held_out_manifest: null  # kept null on purpose: the split policy stays v0-proposed and tests assert this value
